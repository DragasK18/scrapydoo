<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scrappy Doo · Ingresar</title>
  <style>
    :root {
      --brand: #0077B6;
      --brand-dark: #005a8c;
      --texto: #1c2434;
      --muted: #6b7280;
      --borde: #e4eef4;
      --fondo: #f5f9fc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, #eaf6fd 0%, var(--fondo) 55%, #dff0fa 100%);
      color: var(--texto);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border: 1px solid var(--borde);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 20px 50px rgba(0, 90, 140, 0.14);
    }
    .logo {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--brand);
      text-align: center;
    }
    .logo span { color: #a5b4bf; }
    .sub {
      margin: 4px 0 26px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
    label {
      display: block;
      margin: 14px 0 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    input {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 2px solid var(--borde);
      border-radius: 10px;
      font: inherit;
      font-size: 15px;
      color: var(--texto);
    }
    input:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(0, 119, 182, 0.15);
    }
    button {
      width: 100%;
      min-height: 46px;
      margin-top: 24px;
      border: 0;
      border-radius: 10px;
      background: var(--brand);
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button:hover { background: var(--brand-dark); }
    button:disabled { opacity: 0.65; cursor: default; }
    .error {
      margin: 14px 0 0;
      padding: 10px 12px;
      border-radius: 8px;
      background: #fef2f2;
      border-left: 4px solid #dc2626;
      color: #b42318;
      font-size: 13px;
      font-weight: 600;
    }
    .foot {
      margin: 22px 0 0;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="logo">SCRAPPY<span>DOO</span></div>
    <p class="sub">Inteligencia de precios</p>
    <form id="loginForm" autocomplete="on">
      <label for="username">Usuario</label>
      <input id="username" name="username" autocomplete="username" required autofocus />

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <button type="submit" id="submitBtn">Ingresar</button>
      <p class="error" id="error" hidden></p>
    </form>
    <p class="foot">Scrappy Doo · acceso restringido</p>
  </main>

  <script>
    var form = document.getElementById('loginForm');
    var error = document.getElementById('error');
    var btn = document.getElementById('submitBtn');
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      error.hidden = true;
      btn.disabled = true;
      btn.textContent = 'Ingresando...';
      try {
        var resp = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
          })
        });
        var data = await resp.json();
        if (resp.ok) {
          window.location.href = '/';
        } else {
          error.textContent = data.error || 'No se pudo ingresar.';
          error.hidden = false;
          btn.disabled = false;
          btn.textContent = 'Ingresar';
        }
      } catch (ex) {
        error.textContent = 'Error de conexión. Intenta de nuevo.';
        error.hidden = false;
        btn.disabled = false;
        btn.textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>
